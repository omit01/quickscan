services:
  quickscan:
    image: ${QUICKSCAN_IMAGE:-ghcr.io/omit01/quickscan:main}
    pull_policy: always
    environment:
      APP_NAME: "Scouting Website Quickscan"
      APP_ENV: production
      APP_KEY: ${APP_KEY:?Set APP_KEY in the stack environment}
      APP_DEBUG: "false"
      APP_URL: ${APP_URL:?Set APP_URL to the public HTTPS origin}
      APP_LOCALE: nl
      APP_FALLBACK_LOCALE: en
      DEV_SOL_BYPASS: "false"
      SESSION_SECURE_COOKIE: "true"
      SESSION_ENCRYPT: "true"
      SESSION_LIFETIME: "120"
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      OIDC_ISSUER: ${OIDC_ISSUER:?Set OIDC_ISSUER in the stack environment}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:?Set OIDC_CLIENT_ID in the stack environment}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?Set OIDC_CLIENT_SECRET in the stack environment}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-${APP_URL}/auth/sol/callback}
      OIDC_SCOPES: ${OIDC_SCOPES:-openid profile}
      OIDC_MEMBERSHIP_CLAIM: ${OIDC_MEMBERSHIP_CLAIM:-}
      OIDC_MEMBERSHIP_VALUES: ${OIDC_MEMBERSHIP_VALUES:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      GOOGLE_PAGESPEED_API_KEY: ${GOOGLE_PAGESPEED_API_KEY:-}
      LOG_CHANNEL: stderr
      LOG_LEVEL: info
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/quickscan/apps/web/storage/app/quickscan.sqlite
      DB_QUEUE_RETRY_AFTER: "1200"
      QUEUE_CONNECTION: database
      SESSION_DRIVER: database
      CACHE_STORE: database
    ports:
      - "127.0.0.1:8001:80"
    volumes:
      - quickscan-storage:/var/www/quickscan/apps/web/storage
    init: true
    security_opt:
      - seccomp:./docker/chromium-seccomp.json
    stop_grace_period: 960s
    restart: unless-stopped
    shm_size: 256m
    mem_limit: 2g
    cpus: 2
    pids_limit: 512
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  quickscan-storage: